.card{background:var(--sf);border-radius:28px;padding:16px}

.seg .on{background:var(--sc)}
.seg.wrap{flex-wrap:wrap;gap:6px;border:none;border-radius:0}

.big{width:100%;height:64px;border-radius:32px;background:var(--p);color:var(--op);font-size:18px;font-weight:500;margin-top:20px}

.bar{display:flex;align-items:center;gap:10px;padding:10px 0}
.bar .mid{flex:1;font-weight:500}
.chip{background:var(--sc);border-radius:10px;padding:6px 12px;font-size:14px;font-weight:500}
.trk{height:6px;border-radius:3px;background:var(--sfh);overflow:hidden;margin-bottom:6px}
.trk i{display:block;height:100%;background:var(--p);border-radius:3px;transition:width .3s}
#tb{transition:none;background:var(--os);opacity:.5}
.ph{background:var(--pc);color:var(--opc);border-radius:32px;padding:20px;margin-top:12px}
.ph .br{display:inline-block;background:var(--p);color:var(--op);border-radius:100px;padding:7px 18px;font-size:17px;font-weight:700;letter-spacing:.2px}
.ph .mo{font-size:30px;font-weight:500;margin:10px 0 2px;line-height:1.1}
.ph small{opacity:.7}
.sl{display:flex;gap:8px;margin-top:16px}
.sl div{flex:1;background:var(--s);border-radius:18px;padding:10px 8px;text-align:center;font-size:12px;border:2px solid transparent;color:var(--os);min-height:70px}
.sl b{display:block;font-size:14px;margin-top:4px;word-break:break-word}
.sl .act{border-color:var(--p)}.sl .ok{background:var(--okc);color:var(--ook)}.sl .bad{background:var(--erc);color:var(--oer)}
.q{font-size:18px;font-weight:500;margin:20px 4px 10px}
.opt{display:block;width:100%;text-align:left;background:var(--sf);border-radius:20px;padding:16px 18px;font-size:16px;margin-bottom:8px;border:2px solid transparent}
.opt:disabled{opacity:1;cursor:default}
.opt.ok{background:var(--okc);color:var(--ook);border-color:var(--ook)}
.opt.bad{background:var(--erc);color:var(--oer);border-color:var(--oer)}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 4px}
.sw{width:52px;height:32px;border-radius:16px;background:var(--sfh);border:2px solid var(--ol);position:relative}
.sw::after{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--ol);transition:.2s}
.sw.on{background:var(--p);border-color:var(--p)}.sw.on::after{left:26px;top:2px;width:24px;height:24px;background:var(--op)}
.sws{display:flex;flex-wrap:wrap;gap:12px;margin:4px 0 14px}
.sws button{width:44px;height:44px;border-radius:50%;border:3px solid var(--s);box-shadow:0 0 0 0 var(--p)}
.sws .on{box-shadow:0 0 0 3px var(--p)}

input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:var(--s);border:4px solid var(--p)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--s);border:4px solid var(--p)}
.score{background:var(--p);color:var(--op);border-radius:36px;padding:28px;text-align:center;margin-top:16px}

{k:'chip',n:'Процессор',ic:'cpu',o:[{n:'Базовый',c:15,q:15,u:0},{n:'Средний',c:35,q:35,u:60},{n:'Флагманский',c:70,q:60,u:200},{n:'Нейрочип',c:130,q:85,u:500}]},
{k:'ram',n:'Память',ic:'ram',o:[{n:'4 ГБ',c:6,q:6,u:0},{n:'8 ГБ',c:14,q:14,u:40},{n:'16 ГБ',c:30,q:26,u:220}]},
{k:'disp',n:'Экран',ic:'disp',o:[{n:'LCD',c:8,q:10,u:0},{n:'AMOLED',c:20,q:28,u:80},{n:'Гибкий',c:60,q:55,u:350}]},
{k:'cam',n:'Камера',ic:'cam',o:[{n:'12 Мп',c:10,q:12,u:0},{n:'50 Мп',c:22,q:26,u:100},{n:'200 Мп',c:45,q:45,u:250}]},
{k:'bat',n:'Батарея',ic:'bat',o:[{n:'3000 мА·ч',c:8,q:8,u:0},{n:'5000 мА·ч',c:15,q:18,u:50},{n:'7000 мА·ч',c:28,q:30,u:220}]},
{k:'mat',n:'Корпус',ic:'build',o:[{n:'Пластик',c:5,q:5,u:0},{n:'Алюминий',c:15,q:16,u:70},{n:'Стекло',c:25,q:24,u:180},{n:'Титан',c:50,q:42,u:450}]}];
const FOSANIM=[{n:'Выключены',v:0,u:0},{n:'Обычные',v:4,u:0},{n:'Плавные',v:9,u:150}];
const FFONT=[{n:'Стандартный',v:2},{n:'Скруглённый',v:3},{n:'Моно',v:2}];
const FWIDG=[{n:'Выключены',v:0,u:0},{n:'Простые',v:5,u:30},{n:'Динамические',v:12,u:180}];
const WIN_TARGET=1111112;
function fdef(){return {budget:800,rep:0,rp:20,unl:{},sel:{chip:0,ram:0,disp:0,cam:0,bat:0,mat:0},batch:10,price:70,os:{col:0,icon:0,anim:0,font:0,widg:0,ai:false,pw:false,gest:false,face:false,priv:false},loan:null,launches:0,hist:[],saved:0,dead:false,won:false}}
function fload(){try{const r=localStorage.getItem('sf_save_v1');if(r){const d=JSON.parse(r);const base=fdef();return Object.assign(base,d,{sel:Object.assign(base.sel,d.sel||{}),os:Object.assign(base.os,d.os||{}),unl:d.unl||{}})}}catch(e){}return fdef()}
function fsave(){FS.saved=Date.now();try{localStorage.setItem('sf_save_v1',JSON.stringify(FS))}catch(e){}}
let FS=fload(),fpanel=null;
function funl(cat,idx){return idx==0||!!FS.unl[cat+idx]}
function fparts(){let c=0,q=0;FCATS.forEach(cat=>{const o=cat.o[FS.sel[cat.k]];c+=o.c;q+=o.q});return{c,q}}
function fosQual(){return 5+FOSANIM[FS.os.anim].v+FFONT[FS.os.font].v+FWIDG[FS.os.widg].v+(FS.os.gest?4:0)+(FS.os.face?8:0)+(FS.os.priv?10:0)+(FS.os.ai?10:0)+(FS.os.pw?6:0)}
function fset(html){$('f').innerHTML='<div class="fanim">'+html+'</div>'}
function fbar(t){return `<div class="bar"><button class="ib" data-a="fnav" data-v="dash" aria-label="Назад">${ic('back',22)}</button><div class="mid" style="font-size:22px">${t}</div></div>`}

 const p=fparts();
 fset(`<div class="bar"><button class="ib" data-a="go" data-v="h" aria-label="Назад">${ic('back',22)}</button><div class="mid" style="font-size:22px">Фабрика смартфона</div></div>
 <p>День ${FS.launches+1}${FS.dead?' · компания закрыта':''}${FS.won?' · 🏆 империя построена':''}</p>
 <div class="cm">
 <div>${money(FS.budget)}<div class="lb" style="margin:2px 0 0">бюджет</div></div>
 <div>${FS.rep}<div class="lb" style="margin:2px 0 0">репутация</div></div>
 <div>${FS.rp}<div class="lb" style="margin:2px 0 0">очки R&D</div></div>
 <div>${FS.loan?money(Math.round(FS.loan.owe)):'—'}<div class="lb" style="margin:2px 0 0">кредит</div></div>
 </div>
 ${FS.loan?`<div class="bn ${FS.launches>=FS.loan.due-1?'w':''}">${ic('warn',18)}<span>Кредит: погасить до дня ${FS.loan.due+1} (осталось ${FS.loan.due-FS.launches} дн.)</span></div>`:''}
 <h2>УПРАВЛЕНИЕ</h2>
 <button class="nav-b card" data-a="fnav" data-v="build">${ic('build',22)}<div><b>Конструктор</b><br><span style="color:var(--osv);font-size:12px">Себестоимость ${money(p.c)} · качество ${p.q}</span></div></button>
 <button class="nav-b card" data-a="fnav" data-v="rnd">${ic('flask',22)}<div><b>R&D — исследования</b><br><span style="color:var(--osv);font-size:12px">Открывайте компоненты за очки R&D</span></div></button>
 <button class="nav-b card" data-a="fnav" data-v="os">${ic('disp',22)}<div><b>Своя ОС</b><br><span style="color:var(--osv);font-size:12px">Соберите и протестируйте интерфейс</span></div></button>
 <button class="nav-b card" data-a="fnav" data-v="fin">${ic('card',22)}<div><b>Финансы</b><br><span style="color:var(--osv);font-size:12px">Кредиты и история продаж</span></div></button>
 <button class="nav-b card" data-a="fnav" data-v="set">${ic('tune',22)}<div><b>Настройки фабрики</b><br><span style="color:var(--osv);font-size:12px">Сохранение и сброс прогресса</span></div></button>`);
 if(FS.dead)rFBankrupt();
}

function rFBuild(){
 const p=fparts();
 const rows=FCATS.map(cat=>{
  const opts=cat.o.map((o,i)=>`<option value="${i}" ${!funl(cat.k,i)?'disabled':''} ${FS.sel[cat.k]==i?'selected':''}>${o.n} · ${money(o.c)}${funl(cat.k,i)?'':' 🔒 '+o.u+' RP'}</option>`).join('');
  return `<h2>${cat.n.toUpperCase()}</h2><select class="sel" data-cat="${cat.k}">${opts}</select>`;
 }).join('');
 const total=p.c*FS.batch;
 fset(fbar('Конструктор')+
 `<div class="pv"><div class="pvsum"><div class="row"><span>Себестоимость 1 шт</span><b>${money(p.c)}</b></div><div class="row"><span>Качество</span><b>${p.q}</b></div></div></div>
 ${rows}
 <h2>ПАРТИЯ</h2>
 <div class="card"><div class="row"><span>Размер партии</span><input class="sel" type="number" id="fbatch" min="1" max="500" value="${FS.batch}" style="width:90px;text-align:right"></div>
 <div class="row"><span>Цена продажи</span><input class="sel" type="number" id="fprice" min="1" value="${FS.price}" style="width:90px;text-align:right"></div>
 <div class="row"><span>Затраты на партию</span><b>${money(total)}</b></div></div>
 <button class="big" id="flaunchbtn" ${total>FS.budget||FS.dead?'disabled':''}>${ic('factory',20)}Запустить производство</button>
 ${total>FS.budget?'<div class="bn w">'+ic('warn',18)+'<span>Не хватает бюджета — уменьшите партию или возьмите кредит в разделе «Финансы».</span></div>':''}`);
 $('f').querySelectorAll('select[data-cat]').forEach(s=>s.addEventListener('change',e=>{FS.sel[e.target.dataset.cat]=+e.target.value;fsave();rFBuild()}));
 $('fbatch').addEventListener('input',e=>{FS.batch=Math.max(1,+e.target.value||1);fsave();rFBuild()});
 $('fprice').addEventListener('input',e=>{FS.price=Math.max(1,+e.target.value||1);fsave();rFBuild()});
 $('flaunchbtn').addEventListener('click',flaunch);
}

function flaunch(){
 const p=fparts(),cost=p.c*FS.batch;
 if(cost>FS.budget||FS.dead)return;
 FS.budget-=cost;fsave();
 const dur=Math.round((10+Math.random()*10)*1000);
 rFSelling();
 const t0=Date.now(),timer=setInterval(()=>{const el=$('sellbar');if(!el)return clearInterval(timer);const pct=Math.min(100,(Date.now()-t0)/dur*100);el.style.width=pct+'%';if(pct>=100)clearInterval(timer)},150);
 setTimeout(()=>flaunchResolve(p,cost),dur);
}
function rFSelling(){
 fset(`<div style="text-align:center;padding:56px 0 26px">
 <div style="display:inline-block;animation:pop 1.1s ease-in-out infinite">${ic('factory',44)}</div>
 <h1 style="margin-top:14px">Продаю...</h1>
 <p>Партия из ${FS.batch} шт едет по магазинам</p>
 </div>
 <div class="trk"><i id="sellbar" style="width:0%"></i></div>`);
}
function flaunchResolve(p,cost){
 const fair=p.c*(1+p.q/55),valueScore=fair/FS.price;
 const priceFactor=valueScore>=1?1:Math.pow(Math.max(valueScore,0),1.6);
 const appeal=Math.min(1,0.55+Math.min(FS.rep,300)/400+fosQual()/300);
 const frac=Math.max(0,Math.min(1,priceFactor*appeal));
 const rnd=0.85+Math.random()*0.3;
 const sold=Math.min(FS.batch,Math.round(FS.batch*frac*rnd));
 const revenue=sold*FS.price,profit=revenue-cost;
 FS.budget+=revenue;
 FS.rep=Math.max(0,FS.rep+(frac>0.65?3:frac<0.3?-4:1));
 const rpGain=Math.round(sold/8)+1;FS.rp+=rpGain;
 FS.launches++;
 FS.hist.unshift({d:FS.launches,sold,batch:FS.batch,profit});
 FS.hist=FS.hist.slice(0,12);
 if(FS.loan&&FS.launches>=FS.loan.due){
  if(FS.budget>=FS.loan.owe){FS.budget-=FS.loan.owe;FS.loan=null}
  else{FS.dead=true}
 }
 const justWon=!FS.won&&!FS.dead&&FS.budget>=WIN_TARGET;
 if(justWon)FS.won=true;
 fsave();
 rFResult(sold,revenue,cost,profit,rpGain,frac,justWon);
}

 fset(`<h1 style="margin-top:24px">${FS.dead?'Банкротство':justWon?'Партия продана 🏆':'Партия продана'}</h1>
 <div class="card">
 <div class="row"><span>Продано</span><b>${sold} / ${FS.batch} шт</b></div>
 <div class="row"><span>Спрос</span><b>${Math.round(frac*100)}%</b></div>
 <div class="row"><span>Выручка</span><b>${money(revenue)}</b></div>
 <div class="row"><span>Затраты</span><b>${money(cost)}</b></div>
 <div class="row"><span>Прибыль</span><b class="${profit>=0?'ok':'bad'}">${profit>=0?'+':''}${money(profit)}</b></div>
 <div class="row"><span>Очки R&D</span><b>+${rpGain}</b></div>
 </div>
 <button class="big" data-a="fresultok">${FS.dead?'Итоги':'Продолжить'}</button>`);
 if(justWon)rFWin();
}

function rFRnd(){

 FOSANIM.forEach((o,i)=>{if(i>0&&!funl('anim',i))items.push({key:'anim'+i,name:'ОС: анимации «'+o.n+'»',cost:o.u})});

 if(!FS.unl.face)items.push({key:'face',name:'ОС: разблокировка по лицу',cost:100});

 (items.length?items.map(it=>`<div class="card row" style="margin-bottom:8px"><span>${it.name}</span><button class="chip" data-a="funlock" data-v="${it.key}:${it.cost}" ${FS.rp<it.cost?'disabled':''} style="${FS.rp<it.cost?'opacity:.4':''}">${it.cost} RP</button></div>`).join(''):'<p>Все текущие компоненты уже открыты</p>'));
}

const FR={dash:rFDash,build:rFBuild,rnd:rFRnd,os:rFOs,fin:rFFin,set:rFSet};

const A={
 go(v){if(v=='h')rH();if(v=='st')rS();if(v=='b')rB();if(v=='c')rC();if(v=='f')rFDash();show(v)},
 diff(v){S.diff=+v;save();$('dd').textContent=DIFF[S.diff].d;$('bst').textContent=S.best[S.diff]||0},
 theme(v){S.theme=v;save();applyTheme()},
 hue(v){S.hue=+v;save();applyTheme();$('hue').value=S.hue},
 rounds(v){S.rounds=+v;save()},
 vib(){S.vib=!S.vib;save()},
 reset(){S.best=[0,0,0];save();rS()},
 start,pick(v){pick(+v)},
 cur(v){S.cur=v;save()},
 lang(v){S.lang=v;save();document.documentElement.lang=v;rS()},
 mus(){S.mus=!S.mus;save();mus(S.mus)},
 sfx(){S.sfx=!S.sfx;save()},
